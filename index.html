<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street cleaning</title>
<meta name="theme-color" content="#f3f3f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Street cleaning">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --red:#d7263d; --orange:#ff8a1f; --later:#7d8fa3; --accent:#2f7cf6;
  --bg:#f3f3f1; --ink:#2d3135; --muted:#80868c; --glass:rgba(255,255,255,.72); --glass-hi:rgba(255,255,255,.9);
  --edge:rgba(20,24,28,.08); --fill:rgba(20,24,28,.055); --shadow:0 6px 24px rgba(20,24,28,.12);
  --btn:#2d3135; --btn-ink:#fff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1f2023; --ink:#e7e9eb; --muted:#9aa1a8; --glass:rgba(38,40,44,.7); --glass-hi:rgba(38,40,44,.92);
    --edge:rgba(255,255,255,.09); --fill:rgba(255,255,255,.08); --shadow:0 6px 24px rgba(0,0,0,.4); --later:#8a9bb0; --btn:#e7e9eb; --btn-ink:#1f2023; }
}
:root[data-theme="dark"]{ --bg:#1f2023; --ink:#e7e9eb; --muted:#9aa1a8; --glass:rgba(38,40,44,.7); --glass-hi:rgba(38,40,44,.92);
  --edge:rgba(255,255,255,.09); --fill:rgba(255,255,255,.08); --shadow:0 6px 24px rgba(0,0,0,.4); --later:#8a9bb0; --btn:#e7e9eb; --btn-ink:#1f2023; }
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;font-size:15px;line-height:1.35}
#map{position:fixed;inset:0;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid var(--edge);box-shadow:var(--shadow)}

.search{position:fixed;z-index:500;left:12px;right:70px;top:calc(env(safe-area-inset-top,0px) + 12px)}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 16px;border-radius:14px;color:var(--ink);outline:none;-webkit-appearance:none}
.search input::placeholder{color:var(--muted)}
.search ul{list-style:none;margin:8px 0 0;padding:4px;border-radius:14px;max-height:46vh;overflow:auto;background:var(--glass-hi)}
.search ul:empty{display:none}
.search li button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px}
.search li button:active{background:var(--fill)}
.search small{color:var(--muted)}

.fabs{position:fixed;z-index:500;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;
  border-radius:14px;overflow:hidden}
.fab{width:46px;height:46px;border:0;background:none;display:grid;place-items:center;padding:0;color:var(--ink);transition:color .15s}
.fab + .fab{border-top:1px solid var(--edge)}
.fab svg{width:22px;height:22px}
.fab:active{background:var(--fill)}
.fab.on{color:var(--accent)}

.sheet{position:fixed;z-index:600;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  border-radius:18px;max-height:62vh;display:flex;flex-direction:column}
.body{overflow:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
.bar{display:flex;align-items:center;gap:6px}
.to{color:var(--muted);font-size:14px}
.pick{position:relative}
.pick select{appearance:none;-webkit-appearance:none;font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--fill);
  border:0;border-radius:10px;padding:8px 26px 7px 11px}
.pick::after{content:"";position:absolute;right:11px;top:50%;width:5px;height:5px;margin-top:-4px;border:solid var(--muted);
  border-width:0 1.5px 1.5px 0;transform:rotate(45deg);pointer-events:none}
.key{margin-left:auto;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);white-space:nowrap}
.key span{display:flex;align-items:center;gap:6px}
.key i{width:14px;height:4px;border-radius:2px;display:inline-block}
.info{width:22px;height:22px;border-radius:50%;border:0;background:var(--fill);color:var(--muted);font-size:12px;font-weight:700;
  padding:0;flex:none;margin-left:4px;font-style:italic}
.attr{font-size:11px;color:var(--muted);margin:8px 2px 0}
.attr a{color:inherit}

.back{border:0;background:none;padding:2px 0 8px;font-weight:600;color:var(--accent)}
.seg{border-left:3px solid var(--later);padding:2px 0 2px 12px;margin:4px 0 18px}
.plate{font-weight:700;font-size:17px}
.dist{color:var(--muted);font-size:13px;margin-left:6px}
h1{font-size:17px;font-weight:700;margin:0 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0}
.when{font-size:16px;font-weight:700;margin:6px 0 0}
.count{font-weight:600}
.facts{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.warn{background:rgba(255,138,31,.16);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:600;display:inline-block;margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:0;background:var(--fill);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.msg{font-size:14px;margin:8px 0 0;color:var(--muted)}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:900;background:var(--bg);color:var(--muted);font-weight:600}
.leaflet-container{font-family:inherit;background:var(--bg)}
</style>
</head>
<body>
<div id="map" aria-label="Map of street cleaning days"></div>
<div class="loading" id="loading">Loading street data</div>

<div class="search">
  <input id="q" class="glass" type="search" placeholder="Search street" autocomplete="off" aria-label="Search street">
  <ul id="results" class="glass"></ul>
</div>

<div class="fabs glass">
  <button class="fab" id="locate" aria-label="Show my location">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 3.5 3.8 10.4l7 2.8 2.8 7z"/></svg>
  </button>
  <button class="fab" id="park" aria-label="Parked here">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M9.5 16.5v-9h3.2a2.6 2.6 0 0 1 0 5.2H9.5"/></svg>
  </button>
</div>

<section class="sheet glass" id="sheet" aria-live="polite">
  <div class="body" id="body"></div>
</section>

<script>
(() => {
const MS_H = 36e5;
const FROM = [[0,'Now'],[1,'1 h'],[3,'3 h'],[6,'6 h'],[12,'12 h'],[24,'1 d'],[48,'2 d']];
const TO = [[1,'1 h'],[3,'3 h'],[6,'6 h'],[12,'12 h'],[24,'1 d'],[48,'2 d'],[72,'3 d'],[144,'6 d'],[168,'7 d']];
const COL = {active:'var(--red)', window:'var(--orange)', later:'var(--later)'};
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let win = store.get('win', {from:0, to:24});
let rows = [], stamp = '', parked = store.get('parked', null);
let view = 'filter', detailRows = [], detailTitle = '';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- map ---------- */
const dark = matchMedia('(prefers-color-scheme: dark)');
const map = L.map('map', {zoomControl:false, attributionControl:false, preferCanvas:true}).setView([59.3293, 18.0686], 13);
const renderer = L.canvas({padding:0.3, tolerance:0});
let tiles;
function setTiles(){
  if (tiles) map.removeLayer(tiles);
  const style = dark.matches ? 'alidade_smooth_dark' : 'alidade_smooth';
  tiles = L.tileLayer(`https://tiles.stadiamaps.com/tiles/${style}/{z}/{x}/{y}{r}.png?api_key=6975c978-9acc-497c-8e59-042143b58220`, {maxZoom:20}).addTo(map);
  tiles.bringToBack();
  if (rows.length) restyle(true);
}
setTiles();
dark.addEventListener?.('change', setTiles);
const selLayer = L.layerGroup().addTo(map);
const meLayer = L.layerGroup().addTo(map);
const parkLayer = L.layerGroup().addTo(map);

/* ---------- data ---------- */
const WD = {'söndag':0,'måndag':1,'tisdag':2,'onsdag':3,'torsdag':4,'fredag':5,'lördag':6};
function dec(a){ const o=[]; let x=0,y=0; for(let i=0;i<a.length;i+=2){ x+=a[i]; y+=a[i+1]; o.push([y/1e5, x/1e5]); } return o; }
function finish(o){
  o.vfD = o.vf ? new Date(o.vf) : null; o.vtD = o.vt ? new Date(o.vt) : null;
  let a=90,b=180,c=-90,d=-180;
  for (const l of o.lines) for (const [la,ln] of l){ if(la<a)a=la; if(ln<b)b=ln; if(la>c)c=la; if(ln>d)d=ln; }
  o.bb = [a,b,c,d]; return o;
}
function normalize(j){
  if (j.f){
    const t = j.t; stamp = j.stamp || '';
    return j.f.map(r => finish({street:t.street[r[0]], dist:t.dist[r[1]], type:t.type[r[2]], rate:t.rate[r[3]], wd:r[4], st:r[5], et:r[6],
      per:r[7]||null, oe:r[8], vf:r[9], vt:r[10], meter:r[11], pl:r[12], ref:r[13], lines:r[14].map(dec)}));
  }
  stamp = j.timeStamp || '';
  return j.features.filter(f => WD[f.properties.START_WEEKDAY] !== undefined).map(f => {
    const p = f.properties, g = f.geometry, m = /BeslutadAr=(\d+)&LopNr=(\d+)/.exec(p.RDT_URL || '');
    const ls = g.type === 'LineString' ? [g.coordinates] : g.coordinates;
    return finish({street:p.STREET_NAME||'', dist:p.CITY_DISTRICT||p.PARKING_DISTRICT||'', type:p.VF_PLATS_TYP||'', rate:p.PARKING_RATE||'',
      wd:WD[p.START_WEEKDAY], st:p.START_TIME, et:p.END_TIME, per:p.START_MONTH?[p.START_MONTH,p.START_DAY,p.END_MONTH,p.END_DAY]:null,
      oe:({'jämna veckor':2,'udda veckor':1})[p.ODD_EVEN]||0, vf:p.VALID_FROM||'', vt:p.VALID_TO||'', meter:p.VF_METER||0, pl:p.VF_PLATSER||0,
      ref:m?m[1]+'-'+m[2]:'', lines:ls.map(l => l.map(c => [c[1], c[0]]))});
  });
}

/* ---------- schedule ---------- */
function isoWeek(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-day); const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/864e5+1)/7); }
function inPeriod(per, d){ if(!per) return true; const md=(d.getMonth()+1)*100+d.getDate(), s=per[0]*100+per[1], e=per[2]*100+per[3];
  return s<=e ? (md>=s && md<=e) : (md>=s || md<=e); }
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114;
  return new Date(y, Math.floor(n/31)-1, (n%31)+1); }
const hcache = {};
function holidayName(d){
  const y = d.getFullYear();
  if (!hcache[y]){
    const E = easter(y), add = n => new Date(E.getFullYear(), E.getMonth(), E.getDate()+n);
    let mid; for (let x=19; x<=25; x++){ const t=new Date(y,5,x); if (t.getDay()===5) mid=t; }
    const list = [[new Date(y,0,1),"New Year's Day"],[new Date(y,0,6),'Epiphany'],[add(-2),'Good Friday'],[add(1),'Easter Monday'],
      [new Date(y,4,1),'May Day'],[add(39),'Ascension Day'],[new Date(y,5,6),'National Day'],[mid,'Midsummer Eve'],
      [new Date(y,11,24),'Christmas Eve'],[new Date(y,11,25),'Christmas Day'],[new Date(y,11,26),'Boxing Day'],[new Date(y,11,31),"New Year's Eve"]];
    hcache[y] = Object.fromEntries(list.map(([t,n]) => [t.toDateString(), n]));
  }
  return hcache[y][d.toDateString()];
}
function nextOcc(r, now){
  const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const off = (r.wd - base.getDay() + 7) % 7;
  for (let i=0; i<60; i++){
    const d = new Date(base.getFullYear(), base.getMonth(), base.getDate()+off+7*i);
    const s = new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(r.st/100), r.st%100);
    const e = new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(r.et/100), r.et%100);
    if (r.vtD && s >= r.vtD) return null;
    if (r.vfD && e <= r.vfD) continue;
    if (!inPeriod(r.per, d)) continue;
    if (r.oe && ((isoWeek(d)%2===0) !== (r.oe===2))) continue;
    if (e > now) return {s, e, hol: holidayName(d)};
  }
  return null;
}
function classify(r, now){
  const n = r.next = nextOcc(r, now);
  if (!n) return 'later';
  if (n.s <= now) return 'active';
  const dh = (n.s - now) / MS_H;
  if (dh < win.from) return 'later';
  if (dh <= win.to) return 'window';
  return 'later';
}

/* ---------- render ---------- */
const STY = {
  active:{weight:6, opacity:1},
  window:{weight:4, opacity:1},
  later:{weight:2.5, opacity:.4}
};
let counts = {};
const zf = () => { const z = map.getZoom(); return z <= 12 ? .55 : z === 13 ? .7 : z === 14 ? .85 : 1; };
let lastZf = null;
map.on('zoomend', () => { if (rows.length && zf() !== lastZf){ lastZf = zf(); restyle(true); } });
function restyle(force){
  const now = new Date(); counts = {active:0, window:0, later:0};
  const colors = {active:cssVar('--red'), window:cssVar('--orange'), later:cssVar('--later')};
  for (const r of rows){
    const c = classify(r, now); counts[c]++;
    if (force || c !== r.cat){
      r.cat = c;
      r.layer.setStyle({color:colors[c], opacity:STY[c].opacity, weight:STY[c].weight*zf()});
      if (c === 'window') r.layer.bringToFront();
    }
  }
  for (const r of rows) if (r.cat === 'active') r.layer.bringToFront();
  render();
}

/* ---------- formatting ---------- */
const pad = n => String(n).padStart(2,'0');
const hm = t => pad(Math.floor(t/100)) + ':' + pad(t%100);
const dayStr = d => `${DAYS[d.getDay()].slice(0,3)} ${d.getDate()} ${MON[d.getMonth()]}`;
function until(ms){
  const m = Math.round(ms/6e4);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m/60);
  if (h < 24) return `${h} h ${m%60} min`;
  return `${Math.floor(h/24)} d ${h%24} h`;
}
function ruleText(r){
  let t = `Every ${DAYS[r.wd]} ${hm(r.st)} to ${hm(r.et)}`;
  if (r.oe) t += r.oe === 2 ? ', even weeks' : ', odd weeks';
  if (r.per) t += `, ${r.per[1]} ${MON[r.per[0]-1]} to ${r.per[3]} ${MON[r.per[2]-1]}`;
  else t += ', all year';
  return t;
}
const rdt = ref => { const [y,n] = ref.split('-'); return `https://rdt.transportstyrelsen.se/rdt/AF06_View.aspx?BeslutsMyndighetKod=0180&BeslutadAr=${y}&LopNr=${n}`; };
const hourLabel = h => (FROM.find(x=>x[0]===h) || TO.find(x=>x[0]===h) || [0,h+' h'])[1];

/* ---------- views ---------- */
function render(){ view === 'filter' ? renderFilter() : renderDetail(); }
function opts(list, key){
  return list.map(([h,l]) => {
    const dis = key==='to' ? h <= win.from : h >= win.to;
    return `<option value="${h}" ${win[key]===h?'selected':''} ${dis?'disabled':''}>${l}</option>`;
  }).join('');
}
let showAttr = false;
function renderFilter(){
  const pt = parked ? new Date(parked.t) : null;
  $('body').innerHTML = `
    <div class="bar">
      <label class="pick"><select data-k="from" aria-label="From">${opts(FROM,'from')}</select></label><span class="to">to</span>
      <label class="pick"><select data-k="to" aria-label="To">${opts(TO,'to')}</select></label>
      <div class="key"><span><i style="background:${COL.active}"></i>Ban now</span><span><i style="background:${COL.window}"></i>Ban during window</span></div>
      <button class="info" data-act="attr" aria-label="Map credits">i</button>
    </div>
    ${showAttr ? '<p class="attr">© <a href="https://stadiamaps.com/">Stadia Maps</a> © <a href="https://openmaptiles.org/">OpenMapTiles</a> © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>. Data: Stockholms stad</p>' : ''}
    ${parked ? `<p class="msg">Car parked ${dayStr(pt)} ${pad(pt.getHours())}:${pad(pt.getMinutes())}. <button class="back" data-act="showpark" style="padding:0">Show cleaning times</button></p>` : ''}`;
}
function segHtml(r, now, extra){
  const n = r.next, c = r.cat;
  let when, cnt;
  if (!n){ when = 'No upcoming cleaning found'; cnt = ''; }
  else if (c === 'active'){ when = `Ban in force until ${hm(r.et)}`; cnt = `Ends in ${until(n.e - now)}`; }
  else { when = `${dayStr(n.s)}, ${hm(r.st)} to ${hm(r.et)}`; cnt = `Starts in ${until(n.s - now)}`; }
  const facts = [
    ['Rule', ruleText(r)],
    ['Parking', r.type || 'Not specified'],
    ['Taxa', r.rate ? r.rate.charAt(0).toUpperCase() + r.rate.slice(1) : 'Not specified'],
    r.meter ? ['Length', r.meter + ' m'] : null,
    r.pl ? ['Spaces', r.pl] : null,
    r.vt ? ['Valid until', new Date(r.vt).toLocaleDateString('en-GB')] : null
  ].filter(Boolean);
  return `<article class="seg cat-${c}" style="border-color:${COL[c]}">
    <span class="plate">${esc(r.street || 'Unnamed street')}</span><span class="dist">${esc(r.dist)}</span>
    <p class="when">${when}</p><p class="count sub">${cnt}${extra||''}</p>
    ${n && n.hol ? `<span class="warn">${n.hol}: check the sign whether the ban applies</span>` : ''}
    <dl class="facts">${facts.map(([k,v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    <div class="acts">
      ${n ? `<button class="btn primary" data-act="ics" data-i="${r.i}">Add reminder</button>` : ''}
      <a class="btn" href="${rdt(r.ref)}" target="_blank" rel="noopener">Regulation ${esc(r.ref)}</a>
    </div></article>`;
}
function renderDetail(){
  const now = new Date();
  $('body').innerHTML = `<button class="back" data-act="back">Back to filter</button>
    ${detailTitle ? `<h1>${detailTitle}</h1><p class="sub" style="margin-bottom:12px">Each side of a street can have its own day</p>` : ''}
    ${detailRows.length ? detailRows.map(r => segHtml(r, now, (r._d != null ? `, ${Math.round(r._d)} m away` : '') + (r._n > 1 ? `, applies to ${r._n} stretches` : ''))).join('') :
      '<p class="msg">No cleaning stretches within 30 m. Move the pin closer to the curb or tap the street on the map.</p>'}`;
}
function openDetail(list, title){
  view = 'detail'; detailRows = list; detailTitle = title || '';
  $('sheet').classList.remove('min');
  selLayer.clearLayers();
  for (const r of list){
    L.polyline(r.lines, {renderer, interactive:false, color:cssVar('--bg'), weight:12, opacity:.95}).addTo(selLayer);
    L.polyline(r.lines, {renderer, interactive:false, color:cssVar(({active:'--red',window:'--orange'})[r.cat] || '--ink'), weight:7}).addTo(selLayer);
  }
  render(); $('body').scrollTop = 0;
}
function closeDetail(){ view = 'filter'; selLayer.clearLayers(); render(); }

/* ---------- hit testing ---------- */
function near(ll, meters){
  const kx = Math.cos(ll.lat*Math.PI/180)*111320, ky = 110540;
  const dLat = meters/ky, dLng = meters/kx, out = [];
  for (const r of rows){
    const b = r.bb;
    if (ll.lat < b[0]-dLat || ll.lat > b[2]+dLat || ll.lng < b[1]-dLng || ll.lng > b[3]+dLng) continue;
    let best = Infinity;
    for (const l of r.lines) for (let i=1; i<l.length; i++){
      const ax=(l[i-1][1]-ll.lng)*kx, ay=(l[i-1][0]-ll.lat)*ky, bx=(l[i][1]-ll.lng)*kx, by=(l[i][0]-ll.lat)*ky;
      const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
      let t = L2 ? -(ax*dx+ay*dy)/L2 : 0; t = Math.max(0, Math.min(1, t));
      const px=ax+t*dx, py=ay+t*dy, d=Math.hypot(px,py);
      if (d < best) best = d;
    }
    if (best <= meters){ r._d = best; r._n = null; out.push(r); }
  }
  const rank = {active:0, window:1, later:2};
  return out.sort((a,b) => (a._d - b._d) || (rank[a.cat]-rank[b.cat])).slice(0, 8);
}
map.on('click', e => {
  const mpp = 40075016.686*Math.cos(e.latlng.lat*Math.PI/180)/Math.pow(2, map.getZoom()+8);
  const hits = near(e.latlng, Math.max(6, 18*mpp));
  hits.forEach(r => r._d = null);
  if (hits.length) openDetail(hits); else if (view === 'detail') closeDetail();
  $('q').blur(); $('results').innerHTML = '';
});

/* ---------- search ---------- */
let streets = [];
$('q').addEventListener('input', () => {
  const q = $('q').value.trim().toLowerCase();
  if (q.length < 2){ $('results').innerHTML = ''; return; }
  const m = streets.filter(s => s.k.includes(q)).sort((a,b) => (b.k.startsWith(q)) - (a.k.startsWith(q)) || a.k.localeCompare(b.k)).slice(0, 8);
  $('results').innerHTML = m.map((s,i) => `<li><button data-s="${streets.indexOf(s)}">${esc(s.name)} <small>${esc(s.dists)}</small></button></li>`).join('')
    || '<li><button disabled>No street matches</button></li>';
});
$('results').addEventListener('click', e => {
  const b = e.target.closest('button[data-s]'); if (!b) return;
  const s = streets[+b.dataset.s];
  const list = rows.filter(r => r.street === s.name);
  $('results').innerHTML = ''; $('q').value = s.name; $('q').blur();
  const rank = {active:0,window:1,later:2}, groups = new Map();
  for (const r of list){
    const k = [r.wd,r.st,r.et,r.per,r.oe,r.rate,r.type,r.dist].join('|');
    if (!groups.has(k)) groups.set(k, {r, n:0}); groups.get(k).n++;
  }
  const cards = [...groups.values()].map(g => { g.r._d = null; g.r._n = g.n; return g.r; }).sort((a,b) => rank[a.cat]-rank[b.cat]);
  openDetail(cards, `${esc(s.name)}: ${list.length} stretches, ${cards.length} distinct rules`);
  L.polyline(list.flatMap(r => r.lines), {renderer, interactive:false, color:cssVar('--bg'), weight:12, opacity:.95}).addTo(selLayer).bringToBack();
  const bounds = L.latLngBounds(list.flatMap(r => r.lines.flat()));
  map.fitBounds(bounds, {paddingTopLeft:[20,80], paddingBottomRight:[20, $('sheet').offsetHeight + 20], maxZoom:17});
});

/* ---------- location ---------- */
let watchId = null, me = null, firstFix = false;
$('locate').addEventListener('click', () => {
  if (!('geolocation' in navigator)){ flash('Location is not available in this browser.'); return; }
  if (me) map.setView(me, Math.max(map.getZoom(), 17));
  if (watchId !== null) return;
  $('locate').classList.add('on'); firstFix = true;
  watchId = navigator.geolocation.watchPosition(p => {
    me = L.latLng(p.coords.latitude, p.coords.longitude);
    meLayer.clearLayers();
    L.circle(me, {radius:p.coords.accuracy, renderer, interactive:false, color:'#2f7cf6', weight:1, fillOpacity:.1}).addTo(meLayer);
    L.circleMarker(me, {radius:8, renderer, interactive:false, color:'#fff', weight:3, fillColor:'#2f7cf6', fillOpacity:1}).addTo(meLayer);
    if (firstFix){ map.setView(me, 17); firstFix = false; }
  }, err => {
    $('locate').classList.remove('on'); watchId = null;
    flash(err.code === 1 ? 'Location is blocked. Allow it in Settings, Privacy, Location Services, Safari Websites.' : 'Could not get your location. Try again outdoors.');
  }, {enableHighAccuracy:true, maximumAge:10000, timeout:20000});
});
function flash(t){ if (view !== 'filter') closeDetail(); $('sheet').classList.remove('min'); $('body').insertAdjacentHTML('afterbegin', `<p class="msg" style="color:var(--red);margin:0 0 8px">${esc(t)}</p>`); }

/* ---------- parked car ---------- */
function drawPark(){
  parkLayer.clearLayers(); $('park').classList.toggle('on', !!parked);
  if (!parked) return;
  L.marker([parked.lat, parked.lng], {interactive:false, icon:L.divIcon({className:'', iconSize:[30,30], iconAnchor:[15,15],
    html:'<div style="width:30px;height:30px;border-radius:6px;background:#2d3135;color:#fff;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);font-family:-apple-system,sans-serif">P</div>'})}).addTo(parkLayer);
}
function showParked(){
  const ll = L.latLng(parked.lat, parked.lng);
  map.setView(ll, Math.max(map.getZoom(), 17));
  openDetail(near(ll, 30), 'Cleaning near your car');
  $('body').insertAdjacentHTML('beforeend', '<div class="acts"><button class="btn" data-act="unpark">Clear parked car</button></div>');
}
$('park').addEventListener('click', () => {
  if (parked){ showParked(); return; }
  const ll = me || map.getCenter();
  parked = {lat:ll.lat, lng:ll.lng, t:Date.now(), src: me ? 'gps' : 'map'};
  store.set('parked', parked); drawPark(); showParked();
  if (!me) $('body').insertAdjacentHTML('afterbegin', '<p class="msg" style="margin:0 0 8px">Saved at the map centre. Tap the location button first to use GPS.</p>');
});

/* ---------- calendar reminder ---------- */
function icsDate(d){ return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''); }
function makeIcs(r){
  const n = r.next, uid = `${r.ref}-${n.s.getTime()}@street-cleaning`;
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//street-cleaning//EN','METHOD:PUBLISH','BEGIN:VEVENT',
    `UID:${uid}`, `DTSTAMP:${icsDate(new Date())}`, `DTSTART:${icsDate(n.s)}`, `DTEND:${icsDate(n.e)}`,
    `SUMMARY:Move car: street cleaning ${r.street}`, `LOCATION:${r.street}, ${r.dist}`,
    `DESCRIPTION:${ruleText(r)}. Regulation 0180 ${r.ref}.`,
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Move car','TRIGGER:-PT12H','END:VALARM',
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Move car','TRIGGER:-PT1H','END:VALARM',
    'END:VEVENT','END:VCALENDAR'];
  const blob = new Blob([lines.join('\r\n')], {type:'text/calendar'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `street-cleaning-${r.street.replace(/\W+/g,'-')}.ics`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

/* ---------- sheet events ---------- */
$('body').addEventListener('change', e => {
  const c = e.target.closest('select[data-k]'); if (!c) return;
  win[c.dataset.k] = +c.value; store.set('win', win); restyle();
});
$('body').addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'back') closeDetail();
  if (act === 'attr'){ showAttr = !showAttr; render(); }
  if (act === 'ics') makeIcs(rows[+a.dataset.i]);
  if (act === 'showpark') showParked();
  if (act === 'unpark'){ parked = null; store.set('parked', null); drawPark(); closeDetail(); }
});

/* ---------- boot ---------- */
fetch('data.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(j => {
  rows = normalize(j);
  rows.forEach((r,i) => { r.i = i; r.layer = L.polyline(r.lines, {renderer, interactive:false, lineCap:'round'}).addTo(map); });
  const by = {};
  for (const r of rows){ if (!r.street) continue; (by[r.street] ||= new Set()).add(r.dist); }
  streets = Object.entries(by).map(([name, d]) => ({name, k:name.toLowerCase(), dists:[...d].slice(0,3).join(', ')}));
  restyle(true); drawPark();
  $('loading').remove();
  setInterval(() => { restyle(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) restyle(); });
}).catch(err => { $('loading').textContent = 'Street data failed to load (' + err.message + '). Check that data.json sits next to index.html.'; });

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
