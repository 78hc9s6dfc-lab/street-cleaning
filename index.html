<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street cleaning</title>
<meta name="theme-color" content="#f3f3f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Street cleaning">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --red:#d7263d; --orange:#ff8a1f; --ok:#2e9e6b; --later:#7d8fa3; --accent:#2f7cf6;
  --bg:#f3f3f1; --ink:#2d3135; --muted:#80868c; --glass:rgba(255,255,255,.72); --glass-hi:rgba(255,255,255,.9);
  --edge:rgba(20,24,28,.08); --fill:rgba(20,24,28,.055); --shadow:0 6px 24px rgba(20,24,28,.12);
  --btn:#2d3135; --btn-ink:#fff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1f2023; --ink:#e7e9eb; --muted:#9aa1a8; --glass:rgba(38,40,44,.7); --glass-hi:rgba(38,40,44,.92);
    --edge:rgba(255,255,255,.09); --fill:rgba(255,255,255,.08); --shadow:0 6px 24px rgba(0,0,0,.4); --later:#8a9bb0; --ok:#43b883; --btn:#e7e9eb; --btn-ink:#1f2023; }
}
:root[data-theme="dark"]{ --bg:#1f2023; --ink:#e7e9eb; --muted:#9aa1a8; --glass:rgba(38,40,44,.7); --glass-hi:rgba(38,40,44,.92);
  --edge:rgba(255,255,255,.09); --fill:rgba(255,255,255,.08); --shadow:0 6px 24px rgba(0,0,0,.4); --later:#8a9bb0; --ok:#43b883; --btn:#e7e9eb; --btn-ink:#1f2023; }
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;font-size:15px;line-height:1.35}
#map{position:fixed;inset:0;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid var(--edge);box-shadow:var(--shadow)}

.search{position:fixed;z-index:500;left:12px;right:70px;top:calc(env(safe-area-inset-top,0px) + 12px)}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 16px;border-radius:14px;color:var(--ink);outline:none;-webkit-appearance:none}
.search input::placeholder{color:var(--muted)}
.search ul{list-style:none;margin:8px 0 0;padding:4px;border-radius:14px;max-height:46vh;overflow:auto;background:var(--glass-hi)}
.search ul:empty{display:none}
.search li button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px}
.search li button:active{background:var(--fill)}
.search small{color:var(--muted)}

.fabs{position:fixed;z-index:500;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;
  border-radius:14px;overflow:hidden}
.fab{width:46px;height:46px;border:0;background:none;display:grid;place-items:center;padding:0;color:var(--ink);transition:color .15s}
.fab + .fab{border-top:1px solid var(--edge)}
.fab svg{width:22px;height:22px}
.fab:active{background:var(--fill)}
.fab.on{color:var(--accent)}

.sheet{position:fixed;z-index:600;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  border-radius:18px;max-height:62vh;display:flex;flex-direction:column}
.body{overflow:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
.bar{display:flex;align-items:center;gap:5px}
.to{color:var(--muted);font-size:14px}
.pick{position:relative}
.pick select{appearance:none;-webkit-appearance:none;font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--fill);
  border:0;border-radius:10px;padding:8px 22px 7px 9px}
.pick::after{content:"";position:absolute;right:9px;top:50%;width:5px;height:5px;margin-top:-4px;border:solid var(--muted);
  border-width:0 1.5px 1.5px 0;transform:rotate(45deg);pointer-events:none}
.key{margin-left:auto;display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.key span{display:flex;align-items:center;gap:6px}
.key i{width:14px;height:4px;border-radius:2px;display:inline-block}
.info{width:22px;height:22px;border-radius:50%;border:0;background:var(--fill);color:var(--muted);font-size:12px;font-weight:700;
  padding:0;flex:none;margin-left:4px;font-style:italic}
.attr{font-size:11px;color:var(--muted);margin:10px 2px 0}
.attr p{margin:6px 0 0}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.tog input{width:18px;height:18px;accent-color:var(--btn)}
.attr a{color:inherit}

.back{border:0;background:none;padding:2px 0 8px;font-weight:600;color:var(--accent)}
.seg{border-left:3px solid var(--later);padding:2px 0 2px 12px;margin:4px 0 18px}
.plate{font-weight:700;font-size:17px}
.dist{color:var(--muted);font-size:13px;margin-left:6px}
h1{font-size:17px;font-weight:700;margin:0 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0}
.when{font-size:16px;font-weight:700;margin:6px 0 0}
.count{font-weight:600}
.facts{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.warn{background:rgba(255,138,31,.16);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:600;display:inline-block;margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:0;background:var(--fill);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.msg{font-size:14px;margin:8px 0 0;color:var(--muted)}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:900;background:var(--bg);color:var(--muted);font-weight:600}
.leaflet-container{font-family:inherit;background:var(--bg)}
</style>
</head>
<body>
<div id="map" aria-label="Map of street cleaning days"></div>
<div class="loading" id="loading">Loading street data</div>

<div class="search">
  <input id="q" class="glass" type="search" placeholder="Search street" autocomplete="off" aria-label="Search street">
  <ul id="results" class="glass"></ul>
</div>

<div class="fabs glass">
  <button class="fab" id="locate" aria-label="Show my location">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 3.5 3.8 10.4l7 2.8 2.8 7z"/></svg>
  </button>
  <button class="fab" id="park" aria-label="Parked here">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M9.5 16.5v-9h3.2a2.6 2.6 0 0 1 0 5.2H9.5"/></svg>
  </button>
</div>

<section class="sheet glass" id="sheet" aria-live="polite">
  <div class="body" id="body"></div>
</section>

<script>
(() => {
const H = 36e5, DAY = 864e5;
const STARTS = [[0,'Now'],[0.5,'+30 min'],[1,'+1 h'],[2,'+2 h'],[3,'+3 h'],[6,'+6 h'],[12,'+12 h'],[24,'+1 d']];
const DURS = [[0.25,'15 min'],[0.5,'30 min'],[1,'1 h'],[2,'2 h'],[3,'3 h'],[4,'4 h'],[6,'6 h'],[12,'12 h'],[24,'1 d'],[48,'2 d'],[72,'3 d'],[120,'5 d'],[168,'7 d']];
const COL = {ok:'var(--ok)', move:'var(--orange)', ban:'var(--red)'};
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DT = ['every day','weekdays','days before Sun/holiday','Sun/holidays','Mon to Sat'];
const VEH = {'rörelsehindrade':'disabled permit holders','motorcykel':'motorcycles','cykel':'bicycles','beskickningsfordon':'diplomatic vehicles',
  'buss':'buses','utryckningsfordon':'emergency vehicles','personbil':'specific cars','moped-klass2':'mopeds','moped-klass1':'mopeds','tung lastbil':'heavy lorries'};

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let win = store.get('win2', {start:0, dur:2});
let showReserved = store.get('showReserved', false);
let rows = [], stamp = '', parked = store.get('parked', null);
let view = 'filter', detailRows = [], detailTitle = '', detailFrom = null, showInfo = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- map ---------- */
const dark = matchMedia('(prefers-color-scheme: dark)');
const map = L.map('map', {zoomControl:false, attributionControl:false, preferCanvas:true}).setView([59.3293, 18.0686], 13);
const renderer = L.canvas({padding:0.3, tolerance:0});
let tiles;
function setTiles(){
  if (tiles) map.removeLayer(tiles);
  const style = dark.matches ? 'alidade_smooth_dark' : 'alidade_smooth';
  tiles = L.tileLayer(`https://tiles.stadiamaps.com/tiles/${style}/{z}/{x}/{y}{r}.png?api_key=6975c978-9acc-497c-8e59-042143b58220`, {maxZoom:20}).addTo(map);
  tiles.bringToBack();
  if (rows.length) restyle(true);
}
setTiles();
dark.addEventListener?.('change', setTiles);
const selLayer = L.layerGroup().addTo(map);
const meLayer = L.layerGroup().addTo(map);
const parkLayer = L.layerGroup().addTo(map);

/* ---------- data ---------- */
function dec(a){ const o=[]; let x=0,y=0; for(let i=0;i<a.length;i+=2){ x+=a[i]; y+=a[i+1]; o.push([y/1e5, x/1e5]); } return o; }
function load(j){
  const t = j.t; stamp = j.stamp || '';
  return j.c.map((r, i) => {
    const o = {i, street:t.street[r[0]], dist:t.dist[r[1]], zone:t.zone[r[2]], types:r[3].map(x => t.type[x]), rates:r[4].map(x => t.rate[x]),
      veh:r[5], meter:r[6], pl:r[7], ref:r[8], vf:r[9], vt:r[10],
      clean:r[11].map(c => ({wd:c[0], st:c[1], et:c[2], per:c[3]||null, oe:c[4]})),
      max:r[12].map(m => ({mins:m[0], dt:m[1], st:m[2], et:m[3], per:m[4]||null})), lines:r[13].map(dec)};
    o.reserved = !!o.veh;
    let a=90,b=180,c=-90,d=-180;
    for (const l of o.lines) for (const [la,ln] of l){ if(la<a)a=la; if(ln<b)b=ln; if(la>c)c=la; if(ln>d)d=ln; }
    o.bb = [a,b,c,d]; return o;
  });
}

/* ---------- calendar helpers ---------- */
function isoWeek(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-day); const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/864e5+1)/7); }
function inPeriod(per, d){ if(!per) return true; const md=(d.getMonth()+1)*100+d.getDate(), s=per[0]*100+per[1], e=per[2]*100+per[3];
  return s<=e ? (md>=s && md<=e) : (md>=s || md<=e); }
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114;
  return new Date(y, Math.floor(n/31)-1, (n%31)+1); }
const hcache = {};
function holidayName(d){
  const y = d.getFullYear();
  if (!hcache[y]){
    const E = easter(y), add = n => new Date(E.getFullYear(), E.getMonth(), E.getDate()+n);
    let mid; for (let x=19; x<=25; x++){ const t=new Date(y,5,x); if (t.getDay()===5) mid=t; }
    const list = [[new Date(y,0,1),"New Year's Day"],[new Date(y,0,6),'Epiphany'],[add(-2),'Good Friday'],[add(1),'Easter Monday'],
      [new Date(y,4,1),'May Day'],[add(39),'Ascension Day'],[new Date(y,5,6),'National Day'],[mid,'Midsummer Eve'],
      [new Date(y,11,24),'Christmas Eve'],[new Date(y,11,25),'Christmas Day'],[new Date(y,11,26),'Boxing Day'],[new Date(y,11,31),"New Year's Eve"]];
    hcache[y] = Object.fromEntries(list.map(([t,n]) => [t.toDateString(), n]));
  }
  return hcache[y][d.toDateString()];
}
const day0 = t => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const at = (d, hhmm) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(hhmm/100), hhmm%100);
const isHelg = d => d.getDay() === 0 || !!holidayName(d);
function dayMatch(dt, d){
  if (!dt) return true;
  const helg = isHelg(d), nextHelg = isHelg(addDays(d,1));
  return dt === 1 ? !helg && !nextHelg : dt === 2 ? !helg && nextHelg : dt === 3 ? helg : !helg;
}

/* ---------- rules engine ---------- */
// Returns {ban:{until,why}} | {move:{at,why}} | {} for parking from a to b
function evaluate(c, a, b){
  let ban = null, move = null;
  const first = addDays(day0(a), -1), last = day0(b);
  for (const r of c.clean){
    for (let d = first; d <= last; d = addDays(d,1)){
      if (d.getDay() !== r.wd || !inPeriod(r.per, d)) continue;
      if (r.oe && ((isoWeek(d)%2===0) !== (r.oe===2))) continue;
      const s = at(d, r.st), e = at(d, r.et);
      if (s <= a && e > a){ if (!ban || e > ban.until) ban = {until:e, why:'cleaning'}; }
      else if (s > a && s < b && (!move || s < move.at)) move = {at:s, why:'cleaning starts'};
    }
  }
  for (const m of c.max){
    const periods = [];
    for (let d = first; d <= last; d = addDays(d,1)){
      if (!dayMatch(m.dt, d) || !inPeriod(m.per, d)) continue;
      const s = at(d, m.st), e = m.et > m.st ? at(d, m.et) : at(addDays(d,1), m.et);
      const p = periods[periods.length-1];
      if (p && s <= p[1]) p[1] = new Date(Math.max(p[1], e)); else periods.push([s, e]);
    }
    for (const [s, e] of periods){
      const os = Math.max(a, s), oe = Math.min(b, e);
      if (oe - os > m.mins*6e4){
        const t = new Date(os + m.mins*6e4);
        if (!move || t < move.at) move = {at:t, why:`${limitText(m.mins)} limit`};
      }
    }
  }
  return ban ? {ban} : move ? {move} : {};
}
function windowNow(){ const a = new Date(Date.now() + win.start*H); return [a, new Date(+a + win.dur*H)]; }
function status(c, a, b){ const v = evaluate(c, a, b); return v.ban ? 'ban' : v.move ? 'move' : 'ok'; }

/* ---------- render map ---------- */
const STY = {ok:{weight:3, opacity:.85}, move:{weight:4, opacity:1}, ban:{weight:4, opacity:1}};
function restyle(force){
  const [a, b] = windowNow();
  const colors = {ok:cssVar('--ok'), move:cssVar('--orange'), ban:cssVar('--red')};
  for (const r of rows){
    const hide = r.reserved && !showReserved;
    if (hide){ if (r.on){ map.removeLayer(r.layer); r.on = false; } continue; }
    if (!r.on){ r.layer.addTo(map); r.on = true; force = true; }
    const c = status(r, a, b);
    if (force || c !== r.cat){ r.cat = c; r.layer.setStyle({color:colors[c], ...STY[c]}); }
  }
  for (const r of rows) if (r.on && r.cat === 'move') r.layer.bringToFront();
  for (const r of rows) if (r.on && r.cat === 'ban') r.layer.bringToFront();
  render();
}

/* ---------- formatting ---------- */
const pad = n => String(n).padStart(2,'0');
const hm = t => pad(Math.floor(t/100)%24) + ':' + pad(t%100);
const clock = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const dayStr = d => `${DAYS[d.getDay()].slice(0,3)} ${d.getDate()} ${MON[d.getMonth()]}`;
function when(d){
  const t = day0(Date.now());
  const dd = Math.round((day0(d) - t)/DAY);
  return (dd === 0 ? 'today' : dd === 1 ? 'tomorrow' : dayStr(d)) + ' ' + clock(d);
}
function limitText(mins){ return mins % 60 ? `${mins} min` : `${mins/60} h`; }
const perText = per => per ? `, ${per[1]} ${MON[per[0]-1]} to ${per[3]} ${MON[per[2]-1]}` : '';
const cleanText = r => `${DAYS[r.wd]}s ${hm(r.st)} to ${hm(r.et)}${r.oe ? (r.oe===2?', even weeks':', odd weeks') : ''}${perText(r.per)}`;
const maxText = m => `Max ${limitText(m.mins)}, ${DT[m.dt]}${m.st===0 && m.et===2400 ? '' : ' ' + hm(m.st) + ' to ' + hm(m.et)}${perText(m.per)}`;
function feeText(c){
  const t = c.rates.map(r => r === 'avgiftsfri' ? 'Free' : r.split(/,?\s*Boende:/)[0].replace(/^taxa (\d+):\s*/,'Taxa $1: ')).filter(Boolean);
  return [...new Set(t)].join('; ') || 'Not specified';
}
function residentText(c){
  if (c.types.includes('P Avgift, boende')){
    const m = c.rates.map(r => /Boende:\s*(.+)$/.exec(r)).find(Boolean);
    return `Allowed with permit for ${c.zone || 'this area'}${m ? ': ' + m[1] : ''}`;
  }
  if (c.types.includes('P-avgift endast besök')) return 'Not allowed, visitors only';
  if (c.types.includes('Avgiftsfri parkering')) return 'Free for everyone';
  return 'No resident parking';
}
const rdt = ref => { const [y,n] = ref.split('-'); return `https://rdt.transportstyrelsen.se/rdt/AF06_View.aspx?BeslutsMyndighetKod=0180&BeslutadAr=${y}&LopNr=${n}`; };

/* ---------- views ---------- */
function render(){ view === 'filter' ? renderFilter() : renderDetail(); }
const opts = (list, cur) => list.map(([h,l]) => `<option value="${h}" ${cur===h?'selected':''}>${l}</option>`).join('');
function renderFilter(){
  const pt = parked ? new Date(parked.t) : null;
  $('body').innerHTML = `
    <div class="bar">
      <label class="pick"><select data-k="start" aria-label="Arrive">${opts(STARTS, win.start)}</select></label><span class="to">for</span>
      <label class="pick"><select data-k="dur" aria-label="Stay">${opts(DURS, win.dur)}</select></label>
      <div class="key"><span><i style="background:${COL.ok}"></i>OK</span><span><i style="background:${COL.move}"></i>Must move</span><span><i style="background:${COL.ban}"></i>Not now</span></div>
      <button class="info" data-act="info" aria-label="Settings and credits">i</button>
    </div>
    ${showInfo ? `<div class="attr">
      <label class="tog"><input type="checkbox" data-act="reserved" ${showReserved?'checked':''}> Show reserved spaces</label>
      <p>Map © <a href="https://stadiamaps.com/">Stadia Maps</a> © <a href="https://openmaptiles.org/">OpenMapTiles</a> © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>. Data: Stockholms stad${stamp ? ', ' + stamp.slice(0,10) : ''}</p></div>` : ''}
    ${parked ? `<p class="msg">Car parked ${dayStr(pt)} ${clock(pt)}. <button class="back" data-act="showpark" style="padding:0">Check this spot</button></p>` : ''}`;
}
function verdictHtml(c, a){
  const [wa, wb] = detailFrom ? [a, new Date(+a + 7*DAY)] : windowNow();
  const v = evaluate(c, a, new Date(+a + 7*DAY));
  const inWin = detailFrom ? (v.ban ? 'ban' : v.move ? 'move' : 'ok') : status(c, wa, wb);
  let head, sub;
  if (v.ban){
    const after = evaluate(c, v.ban.until, new Date(+v.ban.until + 7*DAY));
    head = `No parking until ${when(v.ban.until)}`;
    sub = `Cleaning in progress${after.move ? `. Then OK until ${when(after.move.at)}` : ''}`;
  } else if (v.move){
    head = `${detailFrom ? 'Move by' : 'OK until'} ${when(v.move.at)}`;
    sub = `Then ${v.move.why}`;
  } else { head = 'OK for 7 days'; sub = 'No restriction found in the next 7 days'; }
  return {cat:inWin, html:`<p class="when" style="color:${inWin==='ok'?'var(--ink)':COL[inWin]}">${head}</p><p class="sub">${sub}</p>`, move: v.move || (v.ban ? {at:v.ban.until} : null)};
}
function segHtml(c, extra){
  const a = detailFrom ? new Date(detailFrom) : windowNow()[0];
  const V = verdictHtml(c, a);
  const facts = [
    c.reserved ? ['Reserved', 'Only for ' + (VEH[c.veh] || c.veh)] : null,
    ['Fee', feeText(c)],
    ['Residents', residentText(c)],
    ...c.max.map(m => ['Time limit', maxText(m)]),
    ...c.clean.map(r => ['Cleaning', cleanText(r)]),
    c.types.includes('Tidsreglerat parkerings-/stoppförbud') ? ['Note', 'Time-restricted no parking; times shown as cleaning'] : null,
    c.pl ? ['Spaces', c.pl] : c.meter ? ['Length', c.meter + ' m'] : null
  ].filter(Boolean);
  return `<article class="seg" style="border-color:${COL[V.cat]}">
    <span class="plate">${esc(c.street || 'Unnamed street')}</span><span class="dist">${esc(c.dist)}${extra||''}</span>
    ${V.html}
    <dl class="facts">${facts.map(([k,v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    <div class="acts">
      ${V.move && !V.html.includes('No parking until') ? `<button class="btn primary" data-act="ics" data-i="${c.i}">Remind me to move</button>` : ''}
      <a class="btn" href="${rdt(c.ref)}" target="_blank" rel="noopener">Regulation</a>
    </div></article>`;
}
function renderDetail(){
  $('body').innerHTML = `<button class="back" data-act="back">Back</button>
    ${detailTitle ? `<h1>${detailTitle}</h1>` : ''}
    ${detailRows.length ? detailRows.map(c => segHtml(c, (c._d != null ? `, ${Math.round(c._d)} m away` : '') + (c._n > 1 ? `, ${c._n} stretches` : ''))).join('') :
      '<p class="msg">No regulated parking within 30 m.</p>'}
    ${view === 'detail' && detailFrom ? '<div class="acts"><button class="btn" data-act="unpark">Clear parked car</button></div>' : ''}`;
}
function openDetail(list, title, from){
  view = 'detail'; detailRows = list; detailTitle = title || ''; detailFrom = from || null;
  selLayer.clearLayers();
  for (const c of list){
    L.polyline(c.lines, {renderer, interactive:false, color:cssVar('--bg'), weight:12, opacity:.95}).addTo(selLayer);
    L.polyline(c.lines, {renderer, interactive:false, color:cssVar(({ok:'--ok',move:'--orange',ban:'--red'})[c.cat] || '--ink'), weight:6}).addTo(selLayer);
  }
  render(); $('body').scrollTop = 0;
}
function closeDetail(){ view = 'filter'; detailFrom = null; selLayer.clearLayers(); render(); }

/* ---------- hit testing ---------- */
function near(ll, meters){
  const kx = Math.cos(ll.lat*Math.PI/180)*111320, ky = 110540;
  const dLat = meters/ky, dLng = meters/kx, out = [];
  for (const r of rows){
    if (!r.on) continue;
    const b = r.bb;
    if (ll.lat < b[0]-dLat || ll.lat > b[2]+dLat || ll.lng < b[1]-dLng || ll.lng > b[3]+dLng) continue;
    let best = Infinity;
    for (const l of r.lines) for (let i=1; i<l.length; i++){
      const ax=(l[i-1][1]-ll.lng)*kx, ay=(l[i-1][0]-ll.lat)*ky, bx=(l[i][1]-ll.lng)*kx, by=(l[i][0]-ll.lat)*ky;
      const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
      let t = L2 ? -(ax*dx+ay*dy)/L2 : 0; t = Math.max(0, Math.min(1, t));
      const d = Math.hypot(ax+t*dx, ay+t*dy);
      if (d < best) best = d;
    }
    if (best <= meters){ r._d = best; r._n = null; out.push(r); }
  }
  return out.sort((a,b) => a._d - b._d).slice(0, 8);
}
map.on('click', e => {
  const mpp = 40075016.686*Math.cos(e.latlng.lat*Math.PI/180)/Math.pow(2, map.getZoom()+8);
  const hits = near(e.latlng, Math.max(6, 18*mpp));
  hits.forEach(r => r._d = null);
  if (hits.length) openDetail(hits); else if (view === 'detail') closeDetail();
  $('q').blur(); $('results').innerHTML = '';
});

/* ---------- search ---------- */
let streets = [];
$('q').addEventListener('input', () => {
  const q = $('q').value.trim().toLowerCase();
  if (q.length < 2){ $('results').innerHTML = ''; return; }
  const m = streets.filter(s => s.k.includes(q)).sort((a,b) => (b.k.startsWith(q)) - (a.k.startsWith(q)) || a.k.localeCompare(b.k)).slice(0, 8);
  $('results').innerHTML = m.map(s => `<li><button data-s="${streets.indexOf(s)}">${esc(s.name)} <small>${esc(s.dists)}</small></button></li>`).join('')
    || '<li><button disabled>No street matches</button></li>';
});
$('results').addEventListener('click', e => {
  const b = e.target.closest('button[data-s]'); if (!b) return;
  const s = streets[+b.dataset.s];
  const list = rows.filter(r => r.on && r.street === s.name);
  $('results').innerHTML = ''; $('q').value = s.name; $('q').blur();
  if (!list.length) return;
  const rank = {ok:0, move:1, ban:2}, groups = new Map();
  for (const r of list){
    const k = JSON.stringify([r.dist, r.zone, r.types, r.rates, r.clean, r.max, r.veh]);
    if (!groups.has(k)) groups.set(k, {r, n:0}); groups.get(k).n++;
  }
  const cards = [...groups.values()].map(g => { g.r._d = null; g.r._n = g.n; return g.r; }).sort((a,b) => rank[a.cat]-rank[b.cat]);
  openDetail(cards);
  L.polyline(list.flatMap(r => r.lines), {renderer, interactive:false, color:cssVar('--bg'), weight:12, opacity:.95}).addTo(selLayer).bringToBack();
  map.fitBounds(L.latLngBounds(list.flatMap(r => r.lines.flat())), {paddingTopLeft:[20,80], paddingBottomRight:[20, $('sheet').offsetHeight + 20], maxZoom:17});
});

/* ---------- location ---------- */
let watchId = null, me = null, firstFix = false;
$('locate').addEventListener('click', () => {
  if (!('geolocation' in navigator)){ flash('Location is not available in this browser.'); return; }
  if (me) map.setView(me, Math.max(map.getZoom(), 17));
  if (watchId !== null) return;
  $('locate').classList.add('on'); firstFix = true;
  watchId = navigator.geolocation.watchPosition(p => {
    me = L.latLng(p.coords.latitude, p.coords.longitude);
    meLayer.clearLayers();
    L.circle(me, {radius:p.coords.accuracy, renderer, interactive:false, color:'#2f7cf6', weight:1, fillOpacity:.1}).addTo(meLayer);
    L.circleMarker(me, {radius:8, renderer, interactive:false, color:'#fff', weight:3, fillColor:'#2f7cf6', fillOpacity:1}).addTo(meLayer);
    if (firstFix){ map.setView(me, 17); firstFix = false; }
  }, err => {
    $('locate').classList.remove('on'); watchId = null;
    flash(err.code === 1 ? 'Location is blocked. Allow it in Settings, Privacy, Location Services, Safari Websites.' : 'Could not get your location. Try again outdoors.');
  }, {enableHighAccuracy:true, maximumAge:10000, timeout:20000});
});
function flash(t){ if (view !== 'filter') closeDetail(); $('body').insertAdjacentHTML('afterbegin', `<p class="msg" style="color:var(--red);margin:0 0 8px">${esc(t)}</p>`); }

/* ---------- parked car ---------- */
function drawPark(){
  parkLayer.clearLayers(); $('park').classList.toggle('on', !!parked);
  if (!parked) return;
  L.marker([parked.lat, parked.lng], {interactive:false, icon:L.divIcon({className:'', iconSize:[30,30], iconAnchor:[15,15],
    html:'<div style="width:30px;height:30px;border-radius:9px;background:#2d3135;color:#fff;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);font-family:-apple-system,sans-serif">P</div>'})}).addTo(parkLayer);
}
function showParked(){
  const ll = L.latLng(parked.lat, parked.lng);
  map.setView(ll, Math.max(map.getZoom(), 17));
  openDetail(near(ll, 30), 'Your car', parked.t);
}
$('park').addEventListener('click', () => {
  if (parked){ showParked(); return; }
  const ll = me || map.getCenter();
  parked = {lat:ll.lat, lng:ll.lng, t:Date.now()};
  store.set('parked', parked); drawPark(); showParked();
  if (!me) $('body').insertAdjacentHTML('afterbegin', '<p class="msg" style="margin:0 0 8px">Saved at the map centre. Tap the location button first to use GPS.</p>');
});

/* ---------- calendar reminder ---------- */
function icsDate(d){ return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''); }
function makeIcs(c){
  const a = detailFrom ? new Date(detailFrom) : windowNow()[0];
  const v = evaluate(c, a, new Date(+a + 7*DAY)); if (!v.move) return;
  const t = v.move.at;
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//parking//EN','METHOD:PUBLISH','BEGIN:VEVENT',
    `UID:${c.ref}-${+t}@parking`, `DTSTAMP:${icsDate(new Date())}`, `DTSTART:${icsDate(new Date(+t - 30*6e4))}`, `DTEND:${icsDate(t)}`,
    `SUMMARY:Move car, ${c.street}`, `LOCATION:${c.street}, ${c.dist}`, `DESCRIPTION:${v.move.why} at ${clock(t)}.`,
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Move car','TRIGGER:-PT12H','END:VALARM',
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Move car','TRIGGER:-PT30M','END:VALARM',
    'END:VEVENT','END:VCALENDAR'];
  const blob = new Blob([lines.join('\r\n')], {type:'text/calendar'});
  const el = document.createElement('a'); el.href = URL.createObjectURL(blob); el.download = `move-car-${c.street.replace(/\W+/g,'-')}.ics`;
  document.body.appendChild(el); el.click(); setTimeout(() => { URL.revokeObjectURL(el.href); el.remove(); }, 2000);
}

/* ---------- sheet events ---------- */
$('body').addEventListener('change', e => {
  const c = e.target.closest('select[data-k]');
  if (c){ win[c.dataset.k] = +c.value; store.set('win2', win); restyle(); return; }
  if (e.target.dataset.act === 'reserved'){ showReserved = e.target.checked; store.set('showReserved', showReserved); restyle(); }
});
$('body').addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || a.tagName === 'INPUT') return;
  const act = a.dataset.act;
  if (act === 'back') closeDetail();
  if (act === 'info'){ showInfo = !showInfo; render(); }
  if (act === 'ics') makeIcs(rows[+a.dataset.i]);
  if (act === 'showpark') showParked();
  if (act === 'unpark'){ parked = null; store.set('parked', null); drawPark(); closeDetail(); }
});

/* ---------- boot ---------- */
fetch('data.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(j => {
  rows = load(j);
  rows.forEach(r => { r.layer = L.polyline(r.lines, {renderer, interactive:false, lineCap:'round'}); r.on = false; });
  const by = {};
  for (const r of rows){ if (!r.street) continue; (by[r.street] ||= new Set()).add(r.dist); }
  streets = Object.entries(by).map(([name, d]) => ({name, k:name.toLowerCase(), dists:[...d].filter(Boolean).slice(0,3).join(', ')}));
  restyle(true); drawPark();
  $('loading').remove();
  setInterval(() => restyle(), 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) restyle(); });
}).catch(err => { $('loading').textContent = 'Street data failed to load (' + err.message + '). Check that data.json sits next to index.html.'; });

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
